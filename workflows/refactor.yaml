apiVersion: yaah.workflow/v1
kind: Workflow
metadata:
  name: refactor
  version: 1.0.0
spec:
  params:
    target:
      type: string
      required: true
    goal:
      type: string
      required: true
  defaults:
    lane: proposal
    network: deny_all
    grants:
      - path: cmd
        access: readwrite
      - path: internal
        access: readwrite
  budgets:
    max_dispatches: 6
    max_wall_clock_seconds: 1800
    max_concurrent_dispatches: 1
  steps:
    - id: refactor
      kind: delegate
      role: developer
      output: proposal
      prompt: |
        Refactor {{ params.target }} to {{ params.goal }}. Behavior must not
        change. Return a retained proposal and keep the change minimal and
        reviewable; only touch paths under cmd/ and internal/.
    - id: verify
      kind: loop
      needs: [refactor]
      max_iterations: 2
      continue_from: "{{ steps.refactor.output.proposal_id }}"
      until: { from: steps.verify.collect, field: verdict, equals: pass }
      collect: outcomes
      on_failure: continue
      body:
        - id: adjust
          kind: delegate
          role: developer
          output: adjust_proposal
          prompt: |
            The tests failed after the refactor. Adjust the proposal
            {{ steps.refactor.output.proposal_id }} so the tests pass without
            changing behavior. Keep the change minimal and under cmd/ and
            internal/.
        - id: retest
          kind: delegate
          role: golang-tester
          lane: report
          timeout_seconds: 600
          output: Verdict
          prompt: |
            Run the test suite against the adjusted refactor proposal and
            confirm behavior is unchanged.
            Diff: {{ steps.adjust.output.diff }}
            Return JSON only: {"verdict":"pass"|"fail","reasons":[]}.
    - id: land
      kind: settle
      needs: [verify]
      proposals: { from: steps.verify.collect }
      where: { from: steps.verify.collect, field: verdict, equals: pass }
      action: apply
      policy: three_way
      on_conflict: escalate
      on_empty: fail
    - id: report
      kind: emit
      needs: [land]
      value: |
        Refactor of {{ params.target }} landed {{ steps.land.output.settled }}
        proposal(s) after the tests passed.
        Verify rounds: {{ steps.verify.collect }}
      path: artifacts/refactor-report.md
