# Robin code review — direct action pinned to an upstream release SHA.
#
# This file is owned by this repo: do NOT regenerate it with `npx robin-review`.
# The installer preserves workflow files that pass an explicit `github-token`,
# but keep this comment as the marker either way. Update the pin deliberately:
# see the CHANGELOG at https://github.com/antongulin/robin, then resolve the
# tag to its commit SHA (`gh api repos/antongulin/robin/commits/<tag>`).
# Config lives in .github/robin.yml and .github/code-reviewer.md, read from
# the PR base branch.

name: Robin

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/robin') ||
          startsWith(github.event.comment.body, '/summary') ||
          startsWith(github.event.comment.body, '/help')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: robin-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.workflow }}
      cancel-in-progress: true
    steps:
      # v2.13.5 (pin deliberately; upstream ships ~weekly)
      - uses: antongulin/robin@a31f9735129fc4945d216aa6dd6b68a98209820a
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
